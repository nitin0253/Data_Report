<!DOCTYPE html>
<html>
<head>
<title>Ops Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin:0; font-family:Inter; background:#f1f5f9; }

.header {
  background:#111827;
  color:white;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
}

.filters {
  background:white;
  padding:12px 20px;
  display:flex;
  gap:10px;
}

.container { padding:20px; }

.kpis {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.card {
  background:white;
  padding:16px;
  border-radius:12px;
}

.grid {
  margin-top:20px;
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
}

canvas {
  background:white;
  padding:12px;
  border-radius:12px;
}

.table {
  margin-top:20px;
  background:white;
  padding:10px;
  border-radius:10px;
  max-height:300px;
  overflow:auto;
}
</style>
</head>

<body>

<div class="header">
  <h2>🚀 Ops Dashboard</h2>
  <button onclick="loadData()">Sync</button>
</div>

<div class="filters">
  <select id="enterprise"></select>
  <input type="date" id="start">
  <input type="date" id="end">
</div>

<div class="container">

<div class="kpis">
  <div class="card"><p id="r"></p><small>Received Today</small></div>
  <div class="card"><p id="d"></p><small>Delivered Today</small></div>
  <div class="card"><p id="t"></p><small>Total Delivered</small></div>
  <div class="card"><p id="tat"></p><small>Avg TAT</small></div>
</div>

<div class="grid">
  <canvas id="monthly"></canvas>
  <canvas id="ent"></canvas>
</div>

<div class="table" id="table"></div>

</div>

<script>
let charts = {};

async function loadData() {
  const url = `/api/data?enterprise=${enterprise.value}&start=${start.value}&end=${end.value}`;

  const res = await fetch(url);
  const data = await res.json();

  r.innerText = data.kpis.receivedToday;
  d.innerText = data.kpis.deliveredToday;
  t.innerText = data.kpis.totalDelivered;
  tat.innerText = data.kpis.avgTat;

  enterprise.innerHTML =
    `<option value="all">All</option>` +
    data.enterpriseList.map(e=>`<option>${e}</option>`).join("");

  render("monthly", data.charts.monthly, "line");
  render("ent", data.charts.enterprise);

  renderTable(data.raw);
}

function render(id, map, type="bar") {
  if (charts[id]) charts[id].destroy();

  charts[id] = new Chart(document.getElementById(id), {
    type,
    data:{
      labels:Object.keys(map),
      datasets:[{data:Object.values(map)}]
    },
    options:{
      onClick:(e, items)=>{
        if(items.length){
          const label = charts[id].data.labels[items[0].index];
          drill(label);
        }
      }
    }
  });
}

function renderTable(rows){
  table.innerHTML = `
    <table width="100%">
      <tr><th>Enterprise</th><th>Status</th><th>QC</th></tr>
      ${rows.map(r=>`
        <tr>
          <td>${r.Ent_Name}</td>
          <td>${r.status}</td>
          <td>${r.qc_email_id}</td>
        </tr>`).join("")}
    </table>`;
}

function drill(label){
  alert("Drilldown for: " + label);
}

loadData();
</script>

</body>
</html>
