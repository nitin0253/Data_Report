<!DOCTYPE html>
<html>
<head>
<title>Ops Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin:0; font-family:Inter; background:#f1f5f9; }

.header {
  background:#111827;
  color:white;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
}

.container { padding:20px; }

.kpis {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.card {
  background:white;
  padding:16px;
  border-radius:12px;
}

.card p { font-size:24px; font-weight:bold; }

.grid {
  margin-top:20px;
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
}

.subgrid {
  display:grid;
  gap:20px;
}

canvas {
  background:white;
  padding:12px;
  border-radius:12px;
}
</style>
</head>

<body>

<div class="header">
  <h2>🚀 Ops Dashboard</h2>
  <button onclick="loadData()">Sync</button>
</div>

<div class="container">

<div class="kpis">
  <div class="card"><p id="r"></p><small>Received Today</small></div>
  <div class="card"><p id="d"></p><small>Delivered Today</small></div>
  <div class="card"><p id="t"></p><small>Total Delivered</small></div>
  <div class="card"><p id="tat"></p><small>Avg TAT</small></div>
</div>

<div class="grid">
  <canvas id="monthly"></canvas>

  <div class="subgrid">
    <canvas id="ent"></canvas>
    <canvas id="qc"></canvas>
    <canvas id="status"></canvas>
  </div>
</div>

</div>

<script>
let charts = {};

async function loadData() {
  const res = await fetch("/api/data");
  const data = await res.json();

  r.innerText = data.kpis.receivedToday;
  d.innerText = data.kpis.deliveredToday;
  t.innerText = data.kpis.totalDelivered;
  tat.innerText = data.kpis.avgTat;

  render("monthly", data.charts.monthly, "line");
  render("ent", data.charts.enterprise);
  render("qc", data.charts.qc);
  render("status", data.charts.status, "doughnut");
}

function render(id, map, type="bar") {
  if (charts[id]) charts[id].destroy();

  charts[id] = new Chart(document.getElementById(id), {
    type,
    data: {
      labels: Object.keys(map),
      datasets: [{ data: Object.values(map) }]
    }
  });
}

loadData();
</script>

</body>
</html>
