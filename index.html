<!DOCTYPE html>
<html>
<head>
<title>Ops Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin:0;
  font-family: Inter, sans-serif;
  background:#f1f5f9;
}

.header {
  background: linear-gradient(90deg,#111827,#1f2937);
  color:white;
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.filters {
  display:flex;
  gap:12px;
  padding:12px 24px;
  background:white;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.container {
  padding:20px;
}

.kpis {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.card {
  background:white;
  padding:16px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.card h4 {
  font-size:13px;
  color:#64748b;
  margin:0;
}

.card p {
  font-size:26px;
  margin-top:6px;
  font-weight:600;
}

.grid {
  margin-top:20px;
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
}

.subgrid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

canvas {
  background:white;
  padding:14px;
  border-radius:12px;
}

button {
  background:#3b82f6;
  color:white;
  border:none;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <h2>🚀 Ops Dashboard</h2>
  <div>
    <button onclick="loadData()">Sync</button>
    <span id="sync"></span>
  </div>
</div>

<div class="filters">
  <select id="enterprise"></select>
  <input type="date" id="start">
  <input type="date" id="end">
</div>

<div class="container">

<div class="kpis">
  <div class="card"><h4>Received Today</h4><p id="r">-</p></div>
  <div class="card"><h4>Delivered Today</h4><p id="d">-</p></div>
  <div class="card"><h4>Total Delivered</h4><p id="t">-</p></div>
  <div class="card"><h4>Avg TAT</h4><p id="tat">-</p></div>
</div>

<div class="grid">
  <canvas id="monthly"></canvas>

  <div class="subgrid">
    <canvas id="ent"></canvas>
    <canvas id="qc"></canvas>
    <canvas id="status"></canvas>
  </div>
</div>

</div>

<script>
let raw = [];
let charts = {};

function parseDateSafe(str) {
  if (!str) return null;

  try {
    const cleaned = str.replace(",", "").replace(",", "");
    return new Date(cleaned);
  } catch {
    return null;
  }
}

async function loadData() {
  document.body.style.opacity = 0.6;

  const res = await fetch("/api/data");
  raw = await res.json();

  setupFilters();
  update();

  sync.innerText = "Last Sync: " + new Date().toLocaleTimeString();
  document.body.style.opacity = 1;
}

function setupFilters() {
  const ents = ["all", ...new Set(raw.map(d=>d.Ent_Name))];
  enterprise.innerHTML = ents.map(e=>`<option>${e}</option>`);

  enterprise.onchange = update;
  start.onchange = update;
  end.onchange = update;
}

function filterData() {
  return raw.filter(d => {
    if (enterprise.value !== "all" && d.Ent_Name !== enterprise.value) return false;

    if (start.value && new Date(d.created) < new Date(start.value)) return false;
    if (end.value && new Date(d.created) > new Date(end.value)) return false;

    return true;
  });
}

function update() {
  const data = filterData();
  const today = new Date().toISOString().slice(0,10);

  const received = data.filter(d => d.created?.toISOString().slice(0,10) === today).length;

  const delivered = data.filter(d =>
    d.status === "done" &&
    d.updated?.toISOString().slice(0,10) === today).length;

  const total = data.filter(d => d.status === "done").length;

  const tatArr = data.map(d => (d.updated - d.created)/60000);
  const avgTat = tatArr.reduce((a,b)=>a+b,0)/tatArr.length || 0;

  r.innerText = received;
  d.innerText = delivered;
  t.innerText = total;
  tat.innerText = avgTat.toFixed(1);

  renderCharts(data);
}

function renderCharts(data) {
  Object.values(charts).forEach(c=>c.destroy());

  // Monthly trend
  const monthMap = {};
  data.forEach(d=>{
    const m = d.created?.toISOString().slice(0,7);
    if (m) monthMap[m]=(monthMap[m]||0)+1;
  });

  charts.monthly = new Chart(monthly, {
    type:"line",
    data:{labels:Object.keys(monthMap), datasets:[{label:"Monthly Volume", data:Object.values(monthMap)}]}
  });

  // Enterprise
  const entMap = {};
  data.forEach(d=> entMap[d.Ent_Name]=(entMap[d.Ent_Name]||0)+1);

  charts.ent = new Chart(ent,{
    type:"bar",
    data:{labels:Object.keys(entMap), datasets:[{data:Object.values(entMap)}]}
  });

  // QC
  const qcMap = {};
  data.forEach(d=> qcMap[d.qc_email_id]=(qcMap[d.qc_email_id]||0)+1);

  charts.qc = new Chart(qc,{
    type:"bar",
    data:{labels:Object.keys(qcMap), datasets:[{data:Object.values(qcMap)}]}
  });

  // Status
  const statusMap = {};
  data.forEach(d=> statusMap[d.status]=(statusMap[d.status]||0)+1);

  charts.status = new Chart(status,{
    type:"doughnut",
    data:{labels:Object.keys(statusMap), datasets:[{data:Object.values(statusMap)}]}
  });
}

loadData();
</script>

</body>
</html>
