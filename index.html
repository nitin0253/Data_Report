<!DOCTYPE html>
<html>
<head>
<title>Ops Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin:0;
  font-family:Inter;
  background:#f4f6f9;
}

.header {
  background:#1b1c1f;
  color:white;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.filters {
  display:flex;
  gap:10px;
  padding:12px 24px;
  background:white;
}

.container {
  padding:20px;
}

.kpis {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.card {
  background:white;
  padding:16px;
  border-radius:10px;
}

.card p {
  font-size:22px;
  font-weight:bold;
}

.charts {
  margin-top:20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

</style>
</head>

<body>

<div class="header">
  <h2>🚀 Ops Dashboard</h2>
  <div>
    <button onclick="loadData()">Sync</button>
    <span id="sync"></span>
  </div>
</div>

<div class="filters">
  <select id="enterprise"></select>
  <input type="date" id="start">
  <input type="date" id="end">
</div>

<div class="container">

<div class="kpis">
  <div class="card">Received <p id="r">-</p></div>
  <div class="card">Delivered Today <p id="d">-</p></div>
  <div class="card">Total Delivered <p id="t">-</p></div>
  <div class="card">Avg TAT <p id="tat">-</p></div>
</div>

<div class="charts">
  <canvas id="ent"></canvas>
  <canvas id="qc"></canvas>
  <canvas id="status"></canvas>
</div>

</div>

<script>
let raw = [];
let charts = {};

async function loadData() {
  document.body.style.opacity = 0.6;

  const res = await fetch("/api/data");
  const data = await res.json();

  if (data.error) {
    alert("API error");
    return;
  }

  raw = data;

  setupFilters();
  update();

  sync.innerText = "Last Sync: " + new Date().toLocaleTimeString();
  document.body.style.opacity = 1;
}

function setupFilters() {
  const ents = ["all", ...new Set(raw.map(d=>d.Ent_Name))];
  enterprise.innerHTML = ents.map(e=>`<option>${e}</option>`);

  enterprise.onchange = update;
  start.onchange = update;
  end.onchange = update;
}

function filterData() {
  return raw.filter(d => {
    if (enterprise.value !== "all" && d.Ent_Name !== enterprise.value)
      return false;

    if (start.value && new Date(d.created) < new Date(start.value))
      return false;

    if (end.value && new Date(d.created) > new Date(end.value))
      return false;

    return true;
  });
}

function update() {
  const data = filterData();
  const today = new Date().toISOString().slice(0,10);

  const received = data.filter(d =>
    d.created.toISOString().slice(0,10) === today).length;

  const delivered = data.filter(d =>
    d.status === "done" &&
    d.updated.toISOString().slice(0,10) === today).length;

  const total = data.filter(d => d.status === "done").length;

  const tatArr = data.map(d => (d.updated - d.created)/60000);
  const avgTat = tatArr.reduce((a,b)=>a+b,0)/tatArr.length || 0;

  r.innerText = received;
  d.innerText = delivered;
  t.innerText = total;
  tat.innerText = avgTat.toFixed(1);

  renderCharts(data);
}

function renderCharts(data) {
  Object.values(charts).forEach(c=>c.destroy());

  const entMap={}, qcMap={}, statusMap={};

  data.forEach(d=>{
    entMap[d.Ent_Name]=(entMap[d.Ent_Name]||0)+1;
    qcMap[d.qc_email_id]=(qcMap[d.qc_email_id]||0)+1;
    statusMap[d.status]=(statusMap[d.status]||0)+1;
  });

  charts.ent = new Chart(ent, {
    type:"bar",
    data:{labels:Object.keys(entMap), datasets:[{data:Object.values(entMap)}]}
  });

  charts.qc = new Chart(qc, {
    type:"bar",
    data:{labels:Object.keys(qcMap), datasets:[{data:Object.values(qcMap)}]}
  });

  charts.status = new Chart(status, {
    type:"doughnut",
    data:{labels:Object.keys(statusMap), datasets:[{data:Object.values(statusMap)}]}
  });
}

loadData();
</script>

</body>
</html>
