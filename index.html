<!DOCTYPE html>
<html>
<head>
<title>Ops Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin:0; font-family:Inter; background:#f1f5f9; }

.header {
  background:#111827;
  color:white;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
}

.filters {
  display:flex;
  gap:10px;
  padding:10px 20px;
  background:white;
}

.container { padding:20px; }

.kpis {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.card {
  background:white;
  padding:16px;
  border-radius:10px;
}

.card p { font-size:22px; font-weight:bold; }

.charts {
  margin-top:20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
</style>
</head>

<body>

<div class="header">
  <h2>🚀 Ops Dashboard</h2>
  <div>
    <button onclick="loadData()">Sync</button>
    <span id="sync"></span>
  </div>
</div>

<div class="filters">
  <select id="enterprise"></select>
</div>

<div class="container">

<div class="kpis">
  <div class="card">Received <p id="r">...</p></div>
  <div class="card">Delivered Today <p id="d">...</p></div>
  <div class="card">Total Delivered <p id="t">...</p></div>
  <div class="card">Avg TAT <p id="tat">...</p></div>
</div>

<div class="charts">
  <canvas id="ent"></canvas>
  <canvas id="status"></canvas>
</div>

</div>

<script>
let raw = [];
let charts = {};

async function loadData() {
  try {
    document.body.style.opacity = 0.5;

    const res = await fetch("/api/data");

    if (!res.ok) throw new Error("API failed");

    raw = (await res.json()).map(d => ({   ...d,   created: d.created ? new Date(d.created) : null,   updated: d.updated ? new Date(d.updated) : null }));

    if (!raw.length) throw new Error("No data");

    setupFilters();
    update();

    sync.innerText = "Last Sync: " + new Date().toLocaleTimeString();

  } catch (e) {
    alert("Error loading data: " + e.message);
  } finally {
    document.body.style.opacity = 1;
  }
}

function setupFilters() {
  const ents = ["all", ...new Set(raw.map(d => d.Ent_Name))];

  enterprise.innerHTML = ents.map(e => `<option>${e}</option>`).join("");
  enterprise.onchange = update;
}

function update() {
  const data = raw.filter(d =>
    enterprise.value === "all" || d.Ent_Name === enterprise.value
  );

  const today = new Date().toISOString().slice(0,10);

  const received = data.filter(d =>
    d.created?.toISOString().slice(0,10) === today
  ).length;

  const delivered = data.filter(d =>
    d.status === "done" &&
    d.updated?.toISOString().slice(0,10) === today
  ).length;

  const total = data.filter(d => d.status === "done").length;

  const tatArr = data
    .filter(d => d.updated && d.created)
    .map(d => (d.updated - d.created)/60000);

  const avgTat = tatArr.length
    ? tatArr.reduce((a,b)=>a+b,0)/tatArr.length
    : 0;

  r.innerText = received;
  d.innerText = delivered;
  t.innerText = total;
  tat.innerText = avgTat.toFixed(1);

  renderCharts(data);
}

function renderCharts(data) {
  Object.values(charts).forEach(c => c.destroy());

  const entMap = {};
  const statusMap = {};

  data.forEach(d => {
    entMap[d.Ent_Name] = (entMap[d.Ent_Name] || 0) + 1;
    statusMap[d.status] = (statusMap[d.status] || 0) + 1;
  });

  charts.ent = new Chart(ent, {
    type:"bar",
    data:{labels:Object.keys(entMap), datasets:[{data:Object.values(entMap)}]}
  });

  charts.status = new Chart(status, {
    type:"doughnut",
    data:{labels:Object.keys(statusMap), datasets:[{data:Object.values(statusMap)}]}
  });
}

loadData();
</script>

</body>
</html>
