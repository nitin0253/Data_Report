<!DOCTYPE html>
<html>
<head>
  <title>Ops Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: Inter; margin: 0; background:#f4f6f9; }

    .header {
      background:#111827; color:white;
      padding:16px 24px;
      display:flex; justify-content:space-between;
    }

    .container { padding:20px; }

    .kpis {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
      margin-bottom:20px;
    }

    .card {
      background:white;
      padding:16px;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,0.05);
    }

    .card h4 { margin:0; color:#666; font-size:13px; }
    .card p { font-size:24px; margin-top:8px; font-weight:bold; }

    .charts {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    canvas {
      background:white;
      padding:10px;
      border-radius:10px;
    }

    button {
      padding:6px 12px;
      border:none;
      background:#2563eb;
      color:white;
      border-radius:6px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="header">
  <h2>🚀 Ops Dashboard</h2>
  <div>
    <button onclick="loadData()">Sync</button>
    <span id="syncTime"></span>
  </div>
</div>

<div class="container">

  <div class="kpis">
    <div class="card"><h4>Received Today</h4><p id="r"></p></div>
    <div class="card"><h4>Delivered Today</h4><p id="d"></p></div>
    <div class="card"><h4>Total Delivered</h4><p id="t"></p></div>
    <div class="card"><h4>Avg TAT (mins)</h4><p id="tat"></p></div>
  </div>

  <div class="charts">
    <canvas id="ent"></canvas>
    <canvas id="qc"></canvas>
    <canvas id="status"></canvas>
  </div>

</div>

<script>
let charts = {};

async function loadData() {
  document.body.style.opacity = 0.6;

  const res = await fetch("/api/data");
  const data = await res.json();

  r.innerText = data.kpis.receivedToday;
  d.innerText = data.kpis.deliveredToday;
  t.innerText = data.kpis.totalDelivered;
  tat.innerText = data.kpis.avgTat;

  renderChart("ent", data.enterprise, "Enterprise");
  renderChart("qc", data.qc, "QC Output");
  renderChart("status", data.status, "Status", "doughnut");

  syncTime.innerText = "Last Sync: " + new Date().toLocaleTimeString();

  document.body.style.opacity = 1;
}

function renderChart(id, map, label, type="bar") {
  if (charts[id]) charts[id].destroy();

  charts[id] = new Chart(document.getElementById(id), {
    type,
    data: {
      labels: Object.keys(map),
      datasets: [{ label, data: Object.values(map) }]
    }
  });
}

loadData();
</script>

</body>
</html>
